# Cada lunes revisa si salió una libtorrent 2.0.x nueva o una versión nueva de vcpkg (Boost, OpenSSL y demás).
# Si hay algo nuevo: lo aplica, sube el número de versión (version.txt), compila, firma, guarda el cambio
# en la rama version-propia y publica la versión:
#   - como Release en este repositorio (es público desde el 28/10/2026), y
#   - en el repositorio público Brizna-Soft/hntorrent-descargas, de donde la baja el actualizador de HNTorrent
#     (y el de Brizna 0.26, el nombre de antes, que así pasa solo a HNTorrent; ver empaquetar.ps1). Ese
#     repositorio se llamaba brizna-descargas: GitHub lleva las direcciones viejas a la nueva.
# Si no hay nada nuevo, termina en un par de minutos.
# A mano (pestaña Actions > Revisar actualizaciones > Run workflow) se puede marcar "forzar" para
# publicar una versión nueva aunque no haya cambiado ninguna biblioteca (por ejemplo, tras un cambio de código).
name: Revisar actualizaciones

on:
  schedule:
    - cron: '17 12 * * 1'   # lunes a las 12:17 UTC (6:17 a. m. en Honduras)
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Publicar una versión nueva aunque no haya bibliotecas nuevas'
        type: boolean
        default: false
      version:
        description: 'Número de la versión a publicar, por ejemplo 0.27.0 (vacío: el siguiente)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: actualizaciones
  cancel-in-progress: false

env:
  REPO_DESCARGAS: Brizna-Soft/hntorrent-descargas

jobs:
  revisar:
    name: Revisar, compilar y publicar
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Traer solo vcpkg
        shell: powershell
        run: git submodule update --init --depth 1 vendor/vcpkg

      - name: Buscar versiones nuevas
        id: buscar
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORZAR: ${{ inputs.forzar }}
          VERSION_PEDIDA: ${{ inputs.version }}
        run: |
          $api = @{ 'User-Agent' = 'hntorrent'; 'Authorization' = "Bearer $env:GITHUB_TOKEN" }
          $ltAntes = (Get-Content -Raw vendor\vcpkg-overlays\ports\libtorrent\vcpkg.json | ConvertFrom-Json).version
          $vcAntes = (git -C vendor\vcpkg rev-parse HEAD).Trim()
          .\actualizar-libtorrent.ps1
          .\actualizar-vcpkg.ps1
          $ltDespues = (Get-Content -Raw vendor\vcpkg-overlays\ports\libtorrent\vcpkg.json | ConvertFrom-Json).version
          $vcDespues = (git -C vendor\vcpkg rev-parse HEAD).Trim()
          $cambios = @()
          if ($ltAntes -ne $ltDespues) { $cambios += "libtorrent $ltAntes -> $ltDespues" }
          if ($vcAntes -ne $vcDespues) {
            $tag = (Invoke-RestMethod -Uri 'https://api.github.com/repos/microsoft/vcpkg/releases/latest' -Headers $api).tag_name
            $cambios += "vcpkg $tag (Boost, OpenSSL y demas)"
          }
          if ($cambios.Count -eq 0 -and ($env:FORZAR -eq 'true' -or $env:VERSION_PEDIDA)) { $cambios += 'publicacion manual' }
          if ($cambios.Count -eq 0) {
            'hay=no' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'Todo al dia: no hay versiones nuevas.'
            exit 0
          }
          $actual = (Get-Content version.txt -TotalCount 1).Trim()
          $v = $actual.Split('.')
          $nueva = '{0}.{1}.{2}' -f $v[0], $v[1], ([int]$v[2] + 1)
          # Un número pedido a mano (por ejemplo, al cambiar el nombre) tiene que ser mayor que el actual
          if ($env:VERSION_PEDIDA) {
            if ($env:VERSION_PEDIDA -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalida: $env:VERSION_PEDIDA" }
            if ([version]$env:VERSION_PEDIDA -le [version]$actual) { throw "La version $env:VERSION_PEDIDA no es mayor que $actual" }
            $nueva = $env:VERSION_PEDIDA
          }
          Set-Content -Path version.txt -Value $nueva -Encoding ascii
          'hay=si' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$nueva" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cambios=$($cambios -join '; ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Hay cambios: $($cambios -join '; ') -> HNTorrent $nueva"

      - name: Traer el resto del código
        if: steps.buscar.outputs.hay == 'si'
        shell: powershell
        run: git submodule update --init --recursive --depth 1

      - name: Carpetas de caché de vcpkg
        if: steps.buscar.outputs.hay == 'si'
        shell: powershell
        run: |
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-binarios" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$env:RUNNER_TEMP\vcpkg-descargas" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Recuperar bibliotecas ya compiladas
        if: steps.buscar.outputs.hay == 'si'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ github.run_id }}
          restore-keys: vcpkg-bin-

      - name: Compilar la versión nueva
        if: steps.buscar.outputs.hay == 'si'
        shell: powershell
        run: .\compilar.ps1 -SinCopiar -Publicacion

      - name: Guardar bibliotecas compiladas
        if: always() && steps.buscar.outputs.hay == 'si'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ github.run_id }}

      # La clave privada solo existe en el disco de la máquina de GitHub mientras se firma
      - name: Empaquetar y firmar
        if: steps.buscar.outputs.hay == 'si'
        shell: powershell
        env:
          FIRMA: ${{ secrets.BRIZNA_FIRMA_PRIVADA }}
        run: |
          if (-not $env:FIRMA) { throw 'Falta el secreto BRIZNA_FIRMA_PRIVADA' }
          $clave = Join-Path $env:RUNNER_TEMP 'firma.pem'
          try {
            [IO.File]::WriteAllText($clave, ($env:FIRMA.TrimStart([char]0xFEFF).Trim() -replace "`r`n", "`n") + "`n")
            icacls $clave /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'No se pudieron restringir los permisos de la clave' }
            .\empaquetar.ps1 -Salida "$env:RUNNER_TEMP\paquete" -ClavePrivada $clave
          }
          finally { Remove-Item $clave -Force -ErrorAction SilentlyContinue }

      - name: Guardar el cambio y publicar en este repositorio
        if: steps.buscar.outputs.hay == 'si'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.buscar.outputs.version }}
          CAMBIOS: ${{ steps.buscar.outputs.cambios }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Solo lo que cambia la revisión: nada de lo que genera la compilación
          git add -- version.txt vendor/vcpkg vendor/vcpkg-overlays
          git commit -m "HNTorrent $env:VERSION`: $env:CAMBIOS"
          git push origin HEAD:version-propia
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo guardar el cambio en version-propia' }
          $archivos = (Get-ChildItem "$env:RUNNER_TEMP\paquete\*").FullName
          $notas = "Actualizacion automatica.`n`n$env:CAMBIOS"
          gh release create "v$env:VERSION" $archivos --title "HNTorrent $env:VERSION" --notes $notas --target (git rev-parse HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar la version' }

      # Sube README, su flujo de publicación y la versión firmada al repositorio público con una
      # "deploy key" que solo puede escribir ahí. Allí otro flujo comprueba la firma y crea la Release.
      - name: Subir al repositorio público de descargas
        if: steps.buscar.outputs.hay == 'si'
        shell: powershell
        env:
          LLAVE: ${{ secrets.DESCARGAS_DEPLOY_KEY }}
          VERSION: ${{ steps.buscar.outputs.version }}
          CAMBIOS: ${{ steps.buscar.outputs.cambios }}
        run: |
          if (-not $env:LLAVE) {
            Write-Host '::warning::Falta el secreto DESCARGAS_DEPLOY_KEY: la version quedo solo en el repositorio privado.'
            exit 0
          }
          $ssh = Join-Path $env:RUNNER_TEMP 'ssh'
          try {
            New-Item -ItemType Directory -Force $ssh | Out-Null
            $llave = Join-Path $ssh 'descargas'
            # OpenSSH no acepta la marca BOM ni los CRLF que puede traer el secreto
            $texto = $env:LLAVE.TrimStart([char]0xFEFF).Trim() -replace "`r`n", "`n"
            [IO.File]::WriteAllText($llave, $texto + "`n")
            icacls $llave /inheritance:r /grant:r "$($env:USERNAME):(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'No se pudieron restringir los permisos de la clave' }
            $meta = Invoke-RestMethod -Uri 'https://api.github.com/meta' -Headers @{ 'User-Agent' = 'hntorrent' }
            $hosts = Join-Path $ssh 'known_hosts'
            [IO.File]::WriteAllLines($hosts, [string[]]($meta.ssh_keys | ForEach-Object { "github.com $_" }))
            $env:GIT_SSH_COMMAND = "C:/Windows/System32/OpenSSH/ssh.exe -i '$($llave -replace '\\', '/')' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$($hosts -replace '\\', '/')'"
            # El repositorio público se rehace en cada versión solo con estos archivos (por eso --force):
            # README y su flujo (carpeta publico) más el paquete firmado y las notas
            $publico = Join-Path $env:RUNNER_TEMP 'publico'
            New-Item -ItemType Directory -Force $publico | Out-Null
            Copy-Item -Recurse -Force publico\* $publico
            Copy-Item -Force "$env:RUNNER_TEMP\paquete\*" $publico
            $notas = "HNTorrent $env:VERSION`n`n$env:CAMBIOS`n`nCada archivo esta firmado: HNTorrent comprueba la firma antes de instalar una actualizacion.`nBrizna-$env:VERSION-x64.zip es el mismo programa para las copias que todavia se llaman Brizna.`n"
            [IO.File]::WriteAllText((Join-Path $publico 'NOTAS.txt'), $notas)
            git -C $publico init -q -b main
            git -C $publico config user.name 'github-actions[bot]'
            git -C $publico config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C $publico add -A
            git -C $publico commit -q -m "HNTorrent $env:VERSION"
            git -C $publico push --force "git@github.com:$env:REPO_DESCARGAS.git" main
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo subir al repositorio de descargas' }
          }
          finally { Remove-Item -Recurse -Force $ssh -ErrorAction SilentlyContinue }
