name: Algo no funciona
description: Cuéntanos qué falló para poder arreglarlo
labels: ["falla"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. HNTorrent es gratis y sin publicidad; tus reportes lo hacen mejor para todos.
        No pongas contraseñas ni datos personales.
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Cuéntalo con tus palabras. Si sale un mensaje de error, cópialo.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: ¿Qué hiciste antes de que fallara?
      placeholder: |
        1. Abrí HNTorrent
        2. Abrí el torrent de...
        3. ...
  - type: textarea
    id: esperabas
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: input
    id: version
    attributes:
      label: Versión de HNTorrent
      description: Está en Ayuda → Acerca de.
      placeholder: "0.1.0"
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11"
  - type: textarea
    id: registro
    attributes:
      label: Registro (opcional)
      description: Si te lo pedimos, pega aquí lo último del registro de HNTorrent (no pongas nombres de archivos privados).
      render: text
